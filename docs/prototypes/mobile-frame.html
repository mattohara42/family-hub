<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub — Tactile on Mobile</title>
<style>
  body{margin:0;background:#0c0d12;font-family:system-ui,sans-serif;display:flex;gap:34px;justify-content:center;align-items:flex-start;padding:34px 20px;flex-wrap:wrap}
  .phone{width:390px;height:780px;border-radius:42px;background:#000;padding:11px;box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);position:relative}
  .phone::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:118px;height:28px;background:#000;border-radius:0 0 16px 16px;z-index:3}
  .screen{width:100%;height:100%;border-radius:32px;overflow:hidden;background:#14151c}
  iframe{width:100%;height:100%;border:0;display:block}
  .cap{color:#8a8d9c;font-size:12px;text-align:center;margin-top:12px;font-weight:600;letter-spacing:.02em}
  .cap b{color:#c9ccdb;font-weight:600}
</style>
</head>
<body>
  <div>
    <div class="phone"><div class="screen"><iframe src="design-lab.html?flavor=tactile&theme=dark&tab=cal&chrome=0" title="Tactile Dark — Calendar"></iframe></div></div>
    <div class="cap"><b>Tactile · Dark</b> — Calendar</div>
  </div>
  <div>
    <div class="phone"><div class="screen"><iframe src="design-lab.html?flavor=tactile&theme=nautical&tab=shop&chrome=0" title="Tactile Nautical — Shopping"></iframe></div></div>
    <div class="cap"><b>Tactile · Nautical</b> — Shopping</div>
  </div>
  <div>
    <div class="phone"><div class="screen"><iframe src="design-lab.html?flavor=tactile&theme=light&tab=today&chrome=0" title="Tactile Light — Today"></iframe></div></div>
    <div class="cap"><b>Tactile · Light</b> — Today</div>
  </div>
</body>
</html>
