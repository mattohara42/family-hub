[build]
  publish = "."
  command = "node netlify-build.js"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/family-hub.html"
  status = 301

[[headers]]
  for = "/*"
  # SAMEORIGIN, not DENY: the Pond Chimes screensaver runs pond/index.html in a
  # same-origin iframe, which DENY blocks. Cross-origin framing — the actual
  # clickjacking risk — is still refused, and the CSP pins frame-src to 'self'.
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=()"

# Never cache the HTML entry point, service worker, or app CSS/JS — users
# must always get the latest version. The service worker's own fetch handler
# is network-first, but that fetch() still runs underneath the browser's own
# HTTP cache: without this, a normal reload (not a hard refresh) could keep
# serving a stale cached family-hub.css/js response without ever reaching
# the network the SW thinks it's hitting.
[[headers]]
  for = "/family-hub.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/family-hub.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/family-hub.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
