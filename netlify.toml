[build]
  publish = "."
  command = "node netlify-build.js"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/family-hub.html"
  status = 301

[[headers]]
  for = "/*"
  # SAMEORIGIN, not DENY: the Pond Chimes screensaver runs pond/index.html in a
  # same-origin iframe, which DENY blocks. Cross-origin framing — the actual
  # clickjacking risk — is still refused, and the CSP pins frame-src to 'self'.
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=()"

# Never cache the HTML entry point or service worker — users must always get
# the latest version so SW updates are picked up promptly.
[[headers]]
  for = "/family-hub.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
